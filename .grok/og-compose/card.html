<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Poppins:wght@900&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #042628;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #042628 url("./bg.jpg") center / cover no-repeat;
    }
    .glow {
      position: absolute;
      right: 6%;
      bottom: 10%;
      width: 38%;
      height: 58%;
      background: radial-gradient(circle, rgba(255, 109, 31, 0.28) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }
    .fox {
      position: absolute;
      right: -18px;
      bottom: -36px;
      height: 640px;
      width: auto;
      z-index: 2;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 64px;
      top: 50%;
      transform: translateY(-54%);
      z-index: 3;
      width: 640px;
    }
    .line-we,
    .line-deals {
      font-family: "Poppins", "Arial Black", system-ui, sans-serif;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .line-we {
      font-size: 72px;
      color: #fff6ea;
      -webkit-text-stroke: 2px #042628;
      text-shadow:
        2px 2px 0 #042628,
        3px 3px 0 #042628,
        4px 4px 0 #042628,
        5px 5px 0 #042628,
        6px 6px 0 #042628,
        8px 10px 16px rgba(0, 0, 0, 0.35);
    }
    .line-deals {
      margin-top: 4px;
      font-size: 132px;
      color: #ff6d1f;
      -webkit-text-stroke: 3px #fff6ea;
      text-shadow:
        -2px -2px 0 #fff6ea,
        2px -2px 0 #fff6ea,
        -2px 2px 0 #fff6ea,
        2px 2px 0 #fff6ea,
        3px 3px 0 #c2500f,
        4px 4px 0 #c2500f,
        5px 5px 0 #c2500f,
        6px 6px 0 #c2500f,
        7px 7px 0 #c2500f,
        8px 8px 0 #c2500f,
        10px 12px 18px rgba(0, 0, 0, 0.4);
    }
    .pill {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      padding: 18px 44px;
      border-radius: 999px;
      background: #ff6d1f;
      color: #fff6ea;
      font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 0.01em;
      line-height: 1;
      box-shadow:
        0 8px 0 #c2500f,
        0 16px 28px rgba(255, 109, 31, 0.42);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <img class="fox" src="./fox.png" alt="" />
    <div class="lockup">
      <div class="line-we">WE LOVE</div>
      <div class="line-deals">DEALS</div>
      <div class="pill">Launch Now</div>
    </div>
  </div>
</body>
</html>
